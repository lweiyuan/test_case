        function compileStr(code) {
            var c = String.fromCharCode(code.charCodeAt(0) + code.length);
            for (var i = 1; i < code.length; i++) {
                c += String.fromCharCode(code.charCodeAt(i) + code.charCodeAt(i - 1));
            }
            return escape(c);
        }
        function uncompileStr(code) {
            code = unescape(code);
            var c = String.fromCharCode(code.charCodeAt(0) - code.length);
            for (var i = 1; i < code.length; i++) {
                c += String.fromCharCode(code.charCodeAt(i) - c.charCodeAt(i - 1));
            }
            return c;
        }
    </script>

<body text="#000000" bgcolor="#FFFFFF" onload="document.all('Username').focus();">
    <form method="post" action="/OALogin" name="loginform">
        <div style="display:none">
            <script>
                function checkinput() {
                    var name = $("#Username").val().trim();
                    var pass = $("#Password").val();
                    if ((name == null || name == '' || name == "itcode") && (pass == null || pass == '' || pass == "密码")) {
                        alert("请输入用户名和密码");
                        return false;
                    } else if (name == null || name == '' || name == "itcode") {
                        alert("请输入用户名");
                        return false;
                    } else if (pass == null || pass == '' || pass == "密码") {
                        alert("请输入密码");
                        return false;
                    } else {
                        var reg = /^(?![\d]+$)(?![a-zA-Z]+$)(?![^\da-zA-Z]+$).{6,40}$/;
                        if (!reg.test(pass)) {
                            alert("您的密码过于简单，若登陆成功将为您跳转至密码修改页，密码修改要求不能少于6位且必须含有“小写字母”、“大写字母”、“数字”、“特殊符号”中的任意两种");
                        }
                        localStorage.username = name;
                        if ($(".checkbox").attr("class").indexOf("checked") > 0) {
                            localStorage.username = name;
                            localStorage.password = compileStr(pass);
                            localStorage.rmbPassword = true;
                        } else if ($(".checkbox").attr("class").indexOf("checked") < 0) {
                            localStorage.rmbPassword = false;
                            localStorage.removeItem("password")
                        }
                        return true;
                    }
                }
            </script>
